name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Install Android NDK & gomobile
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "ndk;26.1.10909125" "platforms;android-24"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          mkdir -p build/tunnel
          cd tunnel
          gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -extldflags=-Wl,-z,max-page-size=16384' \
            -o "../build/tunnel/tunnel.aar" github.com/nqmgaming/blockads-tunnel

      - name: Build IPv6 DNS root helper
        run: ./scripts/build-dns6helper.sh

      - name: MITM auto-bypass policy tests (Go)
        working-directory: tunnel
        run: go test ./internal/mitm/ && go test -run 'Mitm|Transparent|ExportedAPI' .

      - name: Root WireGuard helper tests
        working-directory: tools/wghelper
        run: go vet ./... && go test ./...

      - name: Root WireGuard helper netlink test (network namespace, real kernel)
        working-directory: tools/wghelper
        run: |
          go build -o /tmp/wghelper-test .
          sudo modprobe dummy || true
          sudo WGHELPER_BIN=/tmp/wghelper-test ./netns-test.sh

      - name: Build Root WireGuard helper
        run: ./scripts/build-wghelper.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug + Optimized APKs
        # optimized = release code (R8 + resource shrinking, not debuggable) signed
        # with the same debug key, so it installs over the debug build in place.
        run: ./gradlew -Ptunnel.source=local :app:assembleFdroidDebug :app:assembleFdroidOptimized

      - name: Check optimized APK (signer, native helpers, size)
        run: |
          set -euo pipefail
          signer=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          dbg=$(ls app/build/outputs/apk/fdroid/debug/*arm64-v8a*.apk)
          opt=$(ls app/build/outputs/apk/fdroid/optimized/*arm64-v8a*.apk)
          d=$("$signer" verify --print-certs "$dbg" | grep 'SHA-256 digest')
          o=$("$signer" verify --print-certs "$opt" | grep 'SHA-256 digest')
          echo "debug     $d"; echo "optimized $o"
          [ "$d" = "$o" ] || { echo "::error::optimized APK signer differs from debug"; exit 1; }
          for lib in libblockadswg.so libblockadsdns6.so libgojni.so; do
            unzip -l "$opt" | grep -q "lib/arm64-v8a/$lib" || { echo "::error::$lib missing"; exit 1; }
          done
          ls -l "$dbg" "$opt"; sha256sum "$dbg" "$opt"

      - name: Root Proxy unit tests
        run: ./gradlew -Ptunnel.source=prebuilt :app:testFdroidDebugUnitTest --tests '*Ipv6DnsRedirectTest' --tests '*IptablesManager*' --tests '*IptablesCommands*' --tests '*RootProxy*' --tests '*RootWireGuard*'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-Root-Transparent-Debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          retention-days: 14

      - name: Upload Optimized APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: BlockAds-Root-Transparent-Optimized-arm64
          path: app/build/outputs/apk/fdroid/optimized/*arm64-v8a*.apk
          retention-days: 14
